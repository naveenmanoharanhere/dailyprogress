<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>General Consultancy Progress</title>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    :root {
      --primary: #2563eb;
      --bg: #000000f9;
      --card: #ffffff;
      --border: #e5e7eb;
      --text: #1f2937;
      --muted: #000000;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      height: 500px;   
      background: var(--card);
      width: 100%;
      max-width: 820px;
      padding: 50px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      border: 1px solid var(--border);
    }

    h2 {
      margin: 0 0 20px 0;
      text-align: center;
      font-weight: 600;
    }

    label {
      display: block;
      margin-top: 14px;
      font-size: 14px;
      color: var(--muted);
      font-weight: bold;
    }

    select, input {
      width: 100%;
      margin-top: 6px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 14px;
      outline: none;
    }

    select:focus, input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(37,99,235,0.15);
    }

    button {
      margin-top: 22px;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: var(--primary);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #login {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    footer {
      text-align: center;
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
<div class="container">

  <!-- Logos -->
  <div class="logo-row" style="display: flex; justify-content: center; align-items: center;">
  <img src="download.png" alt="Logo 2" style="height: 40px;">
  <img src="logo.png" alt="Logo 1" style="height: 45px;">
  <span class="logo-text" style="font-size: 28px; font-weight: 700;">(JV)</span>
</div>
  <br>
<h1 style="text-align:center;">General Consultancy(SRLY)</h1>
<h2 style="text-align:center;">Daily Progress Entry Portal</h2><br>
  <!-- Google Login -->
<div id="login" style="transform: scale(1.2);"></div>
  <!-- Entry Form -->
  <form id="form" style="display:none;">

    <label>Date</label>
    <input type="date" id="date" required>

    <label>Jurisdiction</label>
    <select id="column" required></select>

    <label>Category</label>
    <select id="row" required></select>

    <label>Details & Location <br> (Bridge no/LC no/ROB no... & From - To)</label>
    <input id="text" placeholder="Enter details" required>

    <button type="submit">Submit</button>
  </form>

  <footer>
    Data is saved automatically to the selected date sheet
  </footer>
</div>
<script>
/* ======================
   CONFIG
   ====================== */
const CLIENT_ID =
  "893321431924-61hf4pr4dbi5ssc2qs7hhuv0pq9tguo7.apps.googleusercontent.com";

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxOoaC0bDa-Lmq1HEUSD9vav7oVDtkrjYB9SGbJsTqKEvUzHViKNCJ3pJnCDg0DxkGL/exec";

/* ======================
   STATE
   ====================== */
let userEmail = "";

/* ======================
   GOOGLE LOGIN
   ====================== */
window.onload = function () {
  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: onLogin
  });

  google.accounts.id.renderButton(
    document.getElementById("login"),
    { theme: "outline", size: "large" }
  );
};

/* ======================
   AFTER LOGIN
   ====================== */
function onLogin(response) {
  const payload = JSON.parse(
    atob(response.credential.split(".")[1])
  );

  userEmail = payload.email;

  document.getElementById("date").value =
    new Date().toISOString().split("T")[0];

  document.getElementById("form").style.display = "block";

  fetch(SCRIPT_URL)
    .then(res => res.json())
    .then(data => {
      column.innerHTML = "";
      row.innerHTML = "";
      data.columns.forEach(c => column.add(new Option(c, c)));
      data.rows.forEach(r => row.add(new Option(r, r)));
    })
    .catch(() => alert("Failed to load options"));
}

/* ======================
   SUBMIT ENTRY (NO-CORS)
   ====================== */
form.onsubmit = function (e) {
  e.preventDefault();

  fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    body: JSON.stringify({
      date: date.value,
      column: column.value,
      row: row.value,
      text: text.value,
      email: userEmail
    })
  });

  alert("Entry submitted successfully");
  text.value = "";
};
</script>

</body>
</html>
