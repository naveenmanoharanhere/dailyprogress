<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>General Consultancy Progress</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    label { font-weight: bold; }
    select, input, button {
      padding: 8px;
      margin-top: 6px;
      width: 320px;
    }
    button { cursor: pointer; }
  </style>
</head>
<body>

<h2>Progress Entry</h2>

<div id="login"></div>

<form id="form" style="display:none; margin-top:20px;">
  <label>Date</label><br>
  <input type="date" id="date" required><br><br>

  <label>DYCE</label><br>
  <select id="column" required></select><br><br>

  <label>Category / Location</label><br>
  <select id="row" required></select><br><br>

  <label>Entry</label><br>
  <input id="text" required><br><br>

  <button type="submit">Submit</button>
</form>

<script>
const CLIENT_ID =
"893321431924-61hf4pr4dbi5ssc2qs7hhuv0pq9tguo7.apps.googleusercontent.com";

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxOoaC0bDa-Lmq1HEUSD9vav7oVDtkrjYB9SGbJsTqKEvUzHViKNCJ3pJnCDg0DxkGL/exec";

let userEmail = "";

window.onload = () => {
  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: onLogin
  });
  google.accounts.id.renderButton(
    document.getElementById("login"),
    { theme: "outline", size: "large" }
  );
};

function onLogin(response) {
  const payload = JSON.parse(atob(response.credential.split(".")[1]));
  userEmail = payload.email;

  date.value = new Date().toISOString().split("T")[0];
  form.style.display = "block";

  fetch(SCRIPT_URL)
    .then(r => r.json())
    .then(d => {
      column.innerHTML = "";
      row.innerHTML = "";
      d.columns.forEach(c => column.add(new Option(c, c)));
      d.rows.forEach(r => row.add(new Option(r, r)));
    })
    .catch(() => alert("Failed to load dropdowns"));
}

form.onsubmit = e => {
  e.preventDefault();

  fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({
      date: date.value,
      column: column.value,
      row: row.value,
      text: text.value,
      email: userEmail
    })
  })
  .then(r => r.text())
  .then(t => {
    if (t === "SUCCESS") {
      alert("Entry saved successfully");
      text.value = "";
    } else {
      alert(t);
    }
  })
  .catch(() => alert("Submission failed"));
};
</script>

</body>
</html>
