<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>General Consultancy Progress</title>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    select, input, button {
      padding: 8px;
      margin-top: 6px;
      width: 300px;
    }
    button {
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>Progress Entry</h2>

<!-- Google Login Button -->
<div id="login"></div>

<!-- Form (hidden until login) -->
<form id="form" style="display:none; margin-top:20px;">
  <label>DYCE</label><br>
  <select id="column" required></select><br><br>

  <label>Category</label><br>
  <select id="row" required></select><br><br>

  <label>Entry</label><br>
  <input id="text" placeholder="Enter details" required><br><br>

  <button type="submit">Submit</button>
</form>

<script>
/* =======================
   CONFIG – CHANGE THESE
   ======================= */
const CLIENT_ID = "893321431924-61hf4pr4dbi5ssc2qs7hhuv0pq9tguo7.apps.googleusercontent.com";
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxSOhFF-hxZc58fSRakkhhbGX9s7vgZN7HAoYSW3eCpf7uIsIa97ob6J70qlLxi-q98/exec";

/* =======================
   GOOGLE LOGIN
   ======================= */
window.onload = function () {

  if (!window.google || !google.accounts || !google.accounts.id) {
    console.error("Google Identity Services not loaded");
    return;
  }

  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: onLogin
  });

  google.accounts.id.renderButton(
    document.getElementById("login"),
    { theme: "outline", size: "large" }
  );
};

/* =======================
   AFTER LOGIN
   ======================= */
function onLogin(response) {
  document.getElementById("form").style.display = "block";

  // Load rows & columns from sheet
  fetch(SCRIPT_URL)
    .then(res => res.json())
    .then(data => {
      data.columns.forEach(c =>
        column.add(new Option(c, c))
      );
      data.rows.forEach(r =>
        row.add(new Option(r, r))
      );
    });
}

/* =======================
   SUBMIT DATA
   ======================= */
form.onsubmit = function (e) {
  e.preventDefault();

  fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({
      column: column.value,
      row: row.value,
      text: text.value
    })
  }).then(() => {
    alert("Entry saved successfully");
    text.value = "";
  });
};
</script>

</body>
</html>
