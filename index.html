<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>General Consultancy Progress</title>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    label {
      font-weight: bold;
    }
    select, input, button {
      padding: 8px;
      margin-top: 6px;
      width: 320px;
    }
    button {
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>Progress Entry</h2>

<!-- Google Login -->
<div id="login"></div>

<!-- Entry Form -->
<form id="form" style="display:none; margin-top:20px;">

  <!-- DATE -->
  <label>Date</label><br>
  <input type="date" id="date" required><br><br>

  <!-- DYCE -->
  <label>DYCE</label><br>
  <select id="column" required></select><br><br>

  <!-- CATEGORY / LOCATION -->
  <label>Category / Location</label><br>
  <select id="row" required></select><br><br>

  <!-- TEXT -->
  <label>Entry</label><br>
  <input id="text" placeholder="Enter details" required><br><br>

  <button type="submit">Submit</button>
</form>

<script>
/* ======================
   CONFIG (CHANGE THESE)
   ====================== */
const CLIENT_ID =
  "893321431924-61hf4pr4dbi5ssc2qs7hhuv0pq9tguo7.apps.googleusercontent.com";
const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxOoaC0bDa-Lmq1HEUSD9vav7oVDtkrjYB9SGbJsTqKEvUzHViKNCJ3pJnCDg0DxkGL/exec";

/* ======================
   STATE
   ====================== */
let userEmail = "";

/* ======================
   GOOGLE LOGIN
   ====================== */
window.onload = function () {
  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: onLogin
  });

  google.accounts.id.renderButton(
    document.getElementById("login"),
    { theme: "outline", size: "large" }
  );
};

/* ======================
   AFTER LOGIN
   ====================== */
function onLogin(response) {
  const payload = JSON.parse(
    atob(response.credential.split(".")[1])
  );

  userEmail = payload.email;

  // Default date = today
  document.getElementById("date").value =
    new Date().toISOString().split("T")[0];

  document.getElementById("form").style.display = "block";

  // Load dropdown values (from TEMPLATE)
  fetch(SCRIPT_URL)
    .then(res => res.json())
    .then(data => {
      column.innerHTML = "";
      row.innerHTML = "";

      data.columns.forEach(c =>
        column.add(new Option(c, c))
      );
      data.rows.forEach(r =>
        row.add(new Option(r, r))
      );
    });
}

/* ======================
   SUBMIT ENTRY
   ====================== */
form.onsubmit = function (e) {
  e.preventDefault();

  const payload = {
    date: date.value,          // YYYY-MM-DD
    column: column.value,      // DYCE
    row: row.value,            // Category / Location
    text: text.value,          // Entry text
    email: userEmail           // Logged-in account
  };

  fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify(payload)
  }).then(() => {
    alert("Entry saved successfully");
    text.value = "";
  });
};
</script>

</body>
</html>
