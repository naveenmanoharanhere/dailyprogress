<!DOCTYPE html>
<html>
<head>
  <title>General Consultancy Progress</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<h2>Progress Entry</h2>

<div id="login"></div>

<form id="form" style="display:none;">
  <label>DYCE</label><br>
  <select id="column"></select><br><br>

  <label>Category</label><br>
  <select id="row"></select><br><br>

  <label>Entry</label><br>
  <input id="text" placeholder="Enter details" required /><br><br>

  <button>Submit</button>
</form>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxSOhFF-hxZc58fSRakkhhbGX9s7vgZN7HAoYSW3eCpf7uIsIa97ob6J70qlLxi-q98/exec";

google.accounts.id.initialize({
  client_id: "893321431924-61hf4pr4dbi5ssc2qs7hhuv0pq9tguo7.apps.googleusercontent.com",
  callback: onLogin
});

google.accounts.id.renderButton(
  document.getElementById("login"),
  { theme: "outline", size: "large" }
);

function onLogin() {
  form.style.display = "block";

  fetch(SCRIPT_URL)
    .then(r => r.json())
    .then(d => {
      d.columns.forEach(c => column.add(new Option(c, c)));
      d.rows.forEach(r => row.add(new Option(r, r)));
    });
}

form.onsubmit = e => {
  e.preventDefault();

  fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({
      column: column.value,
      row: row.value,
      text: text.value
    })
  }).then(() => {
    alert("Entry saved");
    text.value = "";
  });
};
</script>

</body>
</html>
