<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>General Consultancy Progress</title>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    label {
      font-weight: bold;
    }
    select, input, button {
      padding: 8px;
      margin-top: 6px;
      width: 320px;
    }
    button {
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>Progress Entry</h2>

<!-- Google Login -->
<div id="login"></div>

<!-- Entry Form -->
<form id="form" style="display:none; margin-top:20px;">

  <!-- DATE -->
  <label>Date</label><br>
  <input type="date" id="date" required><br><br>

  <!-- DYCE -->
  <label>DYCE</label><br>
  <select id="column" required></select><br><br>

  <!-- CATEGORY / LOCATION -->
  <label>Category / Location</label><br>
  <select id="row" required></select><br><br>

  <!-- TEXT -->
  <label>Entry</label><br>
  <input id="text" placeholder="Enter details" required><br><br>

  <button type="submit">Submit</button>
</form>

<script>
/* ======================
   CONFIG
   ====================== */
const CLIENT_ID =
  "893321431924-61hf4pr4dbi5ssc2qs7hhuv0pq9tguo7.apps.googleusercontent.com";

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxOoaC0bDa-Lmq1HEUSD9vav7oVDtkrjYB9SGbJsTqKEvUzHViKNCJ3pJnCDg0DxkGL/exec";

/* ======================
   STATE
   ====================== */
let userEmail = "";

/* ======================
   GOOGLE LOGIN
   ====================== */
window.onload = function () {
  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: onLogin
  });

  google.accounts.id.renderButton(
    document.getElementById("login"),
    { theme: "outline", size: "large" }
  );
};

/* ======================
   AFTER LOGIN
   ====================== */
function onLogin(response) {
  const payload = JSON.parse(
    atob(response.credential.split(".")[1])
  );

  userEmail = payload.email;

  // Default date = today
  document.getElementById("date").value =
    new Date().toISOString().split("T")[0];

  document.getElementById("form").style.display = "block";

  console.log("Logged in as:", userEmail);
  console.log("Fetching dropdown data from:", SCRIPT_URL);

  fetch(SCRIPT_URL)
    .then(res => res.text())
    .then(text => {
      console.log("Dropdown raw response:", text);
      const data = JSON.parse(text);

      column.innerHTML = "";
      row.innerHTML = "";

      data.columns.forEach(c =>
        column.add(new Option(c, c))
      );
      data.rows.forEach(r =>
        row.add(new Option(r, r))
      );
    })
    .catch(err => {
      console.error("Failed to load dropdowns:", err);
      alert("Failed to load DYCE / Category list");
    });
}

/* ======================
   SUBMIT ENTRY
   ====================== */
form.onsubmit = function (e) {
  e.preventDefault();

  const payload = {
    date: document.getElementById("date").value,
    column: column.value,
    row: row.value,
    text: text.value,
    email: userEmail
  };

  console.log("Submitting payload:", payload);

  fetch(SCRIPT_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(payload)
  })
    .then(res => res.text())
    .then(responseText => {
      console.log("Server response:", responseText);

      if (responseText === "SUCCESS") {
        alert("Entry saved successfully");
        text.value = "";
      } else {
        alert("Server error: " + responseText);
      }
    })
    .catch(err => {
      console.error("Submission failed:", err);
      alert("Submission failed. Check console.");
    });
};
</script>

</body>
</html>
